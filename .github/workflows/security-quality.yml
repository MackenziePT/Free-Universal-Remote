name: Supply-chain and security checks
on:
  pull_request:
    branches: ["main", "develop"]
  push:
    branches: ["main", "develop"]
permissions:
  contents: read

jobs:
  security-scan:
    name: Windows dependency and static security
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout untrusted source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Python for analysis (not a user-install requirement)
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Prepare disposable QA runtime
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff bandit pip-audit cyclonedx-bom
      - name: Critical Python syntax and undefined names
        run: python -m ruff check --select E9,F63,F7,F82 .
      - name: Bandit medium and high severity
        shell: pwsh
        run: |
          python -m bandit -q -r . -x "./tests,./tools,./evidence,./previous-release" -ll -ii
      - name: Audit dependencies against known advisories
        run: python -m pip_audit -r requirements.txt --format columns
      - name: Generate CycloneDX SBOM
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path qa -Force | Out-Null
          cyclonedx-py environment --output-reproducible --of JSON -o qa/sbom-cyclonedx.json
      - name: Archive QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-quality-sbom
          path: qa/sbom-cyclonedx.json
          if-no-files-found: warn
          retention-days: 21
# No release publishing from PR or unverified build. Signing and code provenance
# require separate protected, manually approved release workflows.
